name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-test:
    # 需要 arm64 的 macOS runner：内置 7zz 是 arm64 构建，构建脚本也按 arm64 出包
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 工具链信息
        run: |
          swift --version
          /usr/bin/tar --version
          sw_vers

      - name: 下载 7-Zip 引擎
        run: ./scripts/fetch-7zz.sh

      - name: 单元测试与断言基线
        run: ./scripts/check-tests.sh

      - name: 检查视图接线与严格并发
        run: ./scripts/check-targets.sh 2>&1 | tee /tmp/check.log
        shell: bash

      - name: 构建 app
        run: |
          ./build.sh > /tmp/build.log 2>&1 || {
            echo "::error::build.sh 失败，以下为最后 25 行"
            tail -25 /tmp/build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
          tail -5 /tmp/build.log

      - name: 校验产物与当前版本发布说明
        run: ./scripts/verify-bundle.sh

      # 失败日志只看得到「exit code 1」，靠这个把尾部贴到 PR 上
      - name: 失败时贴日志
        if: failure() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in /tmp/test.log /tmp/check.log /tmp/build.log; do
            [ -f "$f" ] || continue
            {
              echo '```'
              tail -60 "$f"
              echo '```'
            } > /tmp/ci-body.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/ci-body.md || true
          done

      - name: 上传 app
        uses: actions/upload-artifact@v4
        with:
          name: rrzip-app
          path: build/rrzip.app
          retention-days: 7

      # PR 页面上直接能下 dmg，省得本地再打一次
      - name: 上传 dmg
        uses: actions/upload-artifact@v4
        with:
          name: rrzip-dmg
          path: build/rrzip-*.dmg
          retention-days: 7
          if-no-files-found: error
