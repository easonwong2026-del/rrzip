name: release

# 推 v* 标签即自动构建并发布
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: 下载 7-Zip 引擎
        run: ./scripts/fetch-7zz.sh

      - name: 单元测试
        run: ./scripts/test.sh

      - name: 构建 app
        run: ./build.sh

      # build.sh 已经按 <应用版本> 出了 dmg，这里只改名成带 tag 的名字
      - name: 打包
        id: pack
        run: |
          set -e
          # 版本以包内 Info.plist 为准，不猜、不从文件名反推
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
              build/rrzip.app/Contents/Info.plist)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # 正式发版（tag 触发）必须版本与 tag 对齐，否则下载下来的是错版本
          if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            [ "v${VERSION}" = "${GITHUB_REF_NAME}" ] || {
              echo "::error::tag ${GITHUB_REF_NAME} 与应用版本 v${VERSION} 不一致"
              exit 1
            }
          fi

          DMG="build/rrzip-${VERSION}.dmg"
          [ -f "$DMG" ] || { echo "::error::缺少 $DMG（build.sh 没产出）"; exit 1; }

          NAME="rrzip-${GITHUB_REF_NAME}.dmg"
          cp "$DMG" "build/${NAME}"
          shasum -a 256 "build/${NAME}" | tee "build/${NAME}.sha256"
          echo "asset=build/${NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=build/${NAME}.sha256" >> "$GITHUB_OUTPUT"

      # 只取当前版本那段。以前直接 --notes-file RELEASE_NOTES.md，
      # 把 2.12.0 到 2.0.0 的全部历史都贴进 Release（9000 字）。
      - name: 取发布说明
        run: |
          ./scripts/release-notes.sh "$GITHUB_REF_NAME" > build/notes.md
          cat build/notes.md

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.pack.outputs.asset }}" \
            "${{ steps.pack.outputs.sha }}" \
            --title "rrzip $GITHUB_REF_NAME" \
            --notes-file build/notes.md \
            --verify-tag
